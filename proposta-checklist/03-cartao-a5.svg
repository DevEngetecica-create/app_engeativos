<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 874" width="1240" height="874" font-family="'Segoe UI', Roboto, system-ui, sans-serif">
  <defs>
    <linearGradient id="solBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#ff9f0a"/>
    </linearGradient>
    <linearGradient id="luaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6cb2"/>
      <stop offset="100%" stop-color="#2e3a5e"/>
    </linearGradient>
    <linearGradient id="alertBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e1201d"/>
      <stop offset="100%" stop-color="#a51612"/>
    </linearGradient>
  </defs>

  <!-- Fundo branco com bordas decorativas -->
  <rect width="1240" height="874" fill="#fff"/>
  <rect x="20" y="20" width="1200" height="834" rx="12" fill="none" stroke="#222" stroke-width="3" stroke-dasharray="2,2"/>

  <!-- Faixas laterais decorativas (sangria gráfica) -->
  <rect x="0" y="0" width="20" height="874" fill="url(#solBg)"/>
  <rect x="1220" y="0" width="20" height="874" fill="url(#luaBg)"/>

  <!-- ============ TÍTULO ============ -->
  <g transform="translate(620, 70)">
    <text text-anchor="middle" font-size="22" font-weight="700" fill="#666" letter-spacing="6">A5 PARA IMPRESSÃO · PAINEL DO VEÍCULO</text>
  </g>

  <g transform="translate(620, 130)">
    <text text-anchor="middle" font-size="50" font-weight="900" fill="#222">VOCÊ FAZ</text>
    <text text-anchor="middle" y="65" font-size="80" font-weight="900" fill="#ff7639">2 CHECKLISTS</text>
    <text text-anchor="middle" y="105" font-size="32" font-weight="700" fill="#222">por dia. SEMPRE.</text>
  </g>

  <!-- Linha decorativa -->
  <line x1="200" y1="300" x2="1040" y2="300" stroke="#ddd" stroke-width="2"/>

  <!-- ============ 2 COLUNAS — CHEGADA + SAÍDA ============ -->

  <!-- COLUNA ESQUERDA: 🌅 CHEGOU -->
  <g transform="translate(310, 330)">
    <!-- Círculo sol grande -->
    <circle cx="0" cy="50" r="80" fill="url(#solBg)"/>
    <text x="0" y="78" text-anchor="middle" font-size="100">🌅</text>

    <text x="0" y="190" text-anchor="middle" font-size="38" font-weight="900" fill="#222">CHEGOU?</text>
    <text x="0" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#ff9f0a">ABRA o checklist</text>

    <!-- Card com instruções concretas -->
    <rect x="-200" y="260" width="400" height="170" rx="14" fill="#fffaf0" stroke="#ff9f0a" stroke-width="2"/>
    <text x="0" y="293" text-anchor="middle" font-size="18" font-weight="800" fill="#a3530b">No app:</text>
    <text x="-180" y="325" font-size="20" fill="#222">1. Aperte</text>
    <text x="-30" y="325" font-size="20" font-weight="800" fill="#ff9f0a">🌅 ABRIR</text>
    <text x="-180" y="357" font-size="20" fill="#222">2. Escolha o veículo</text>
    <text x="-180" y="389" font-size="20" fill="#222">3. Marque SIM/NÃO</text>
    <text x="-180" y="421" font-size="20" fill="#222">4. Tire foto se precisar</text>
  </g>

  <!-- Divisor central VERTICAL com sinal de "+" no meio -->
  <line x1="620" y1="330" x2="620" y2="770" stroke="#ddd" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="620" cy="550" r="32" fill="#222"/>
  <text x="620" y="563" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">+</text>

  <!-- COLUNA DIREITA: 🌙 VAI EMBORA -->
  <g transform="translate(930, 330)">
    <!-- Círculo lua grande -->
    <circle cx="0" cy="50" r="80" fill="url(#luaBg)"/>
    <text x="0" y="78" text-anchor="middle" font-size="100">🌙</text>

    <text x="0" y="190" text-anchor="middle" font-size="38" font-weight="900" fill="#222">VAI EMBORA?</text>
    <text x="0" y="232" text-anchor="middle" font-size="26" font-weight="700" fill="#5a6cb2">ENCERRE o checklist</text>

    <rect x="-200" y="260" width="400" height="170" rx="14" fill="#f4f5fb" stroke="#5a6cb2" stroke-width="2"/>
    <text x="0" y="293" text-anchor="middle" font-size="18" font-weight="800" fill="#2e3a5e">No app:</text>
    <text x="-180" y="325" font-size="20" fill="#222">1. Aperte</text>
    <text x="-30" y="325" font-size="20" font-weight="800" fill="#5a6cb2">🌙 ENCERRAR</text>
    <text x="-180" y="357" font-size="20" fill="#222">2. Escolha o MESMO veículo</text>
    <text x="-180" y="389" font-size="20" fill="#222">3. Marque SIM/NÃO</text>
    <text x="-180" y="421" font-size="20" fill="#222">4. Tire foto se precisar</text>
  </g>

  <!-- ============ ALERTA NO RODAPÉ ============ -->
  <g transform="translate(620, 770)">
    <rect x="-540" y="-40" width="1080" height="80" rx="14" fill="url(#alertBg)"/>
    <g transform="translate(-490, 0)">
      <circle cx="0" cy="0" r="24" fill="#fff"/>
      <text x="0" y="9" text-anchor="middle" font-size="32" font-weight="900" fill="#a51612">!</text>
    </g>
    <text x="-440" y="-7" font-size="22" font-weight="900" fill="#fff">ESQUECEU DE ENCERRAR?</text>
    <text x="-440" y="20" font-size="20" font-weight="700" fill="#fff" opacity="0.95">Sua hora trabalhada NÃO vai contar até você fechar.</text>
  </g>

  <!-- RODAPÉ logo -->
  <g transform="translate(620, 838)">
    <text text-anchor="middle" font-size="14" font-weight="800" fill="#222">ENGE<tspan fill="#ff7639">TECNICA</tspan>
      &#160;&#160;·&#160;&#160;
      ENGE<tspan fill="#ff7639">ATIVOS</tspan>
    </text>
  </g>

  <!-- Indicação de tamanho A5 -->
  <text x="40" y="855" font-size="11" fill="#aaa">A5 horizontal · 210×148mm · plastificar e colar no painel</text>
</svg>
