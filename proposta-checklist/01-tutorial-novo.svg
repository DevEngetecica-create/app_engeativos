<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" font-family="'Segoe UI', Roboto, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#25304a"/>
      <stop offset="100%" stop-color="#141a29"/>
    </radialGradient>
    <linearGradient id="phoneEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2438"/>
      <stop offset="100%" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="solBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd966"/>
      <stop offset="100%" stop-color="#ff9f0a"/>
    </linearGradient>
    <linearGradient id="luaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6cb2"/>
      <stop offset="100%" stop-color="#2e3a5e"/>
    </linearGradient>
    <linearGradient id="alertBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e1201d"/>
      <stop offset="100%" stop-color="#a51612"/>
    </linearGradient>
    <linearGradient id="okBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dc88a"/>
      <stop offset="100%" stop-color="#1a9b6c"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- TÍTULO -->
  <g transform="translate(540, 100)">
    <text text-anchor="middle" font-size="22" font-weight="700" fill="#a3aec5" letter-spacing="6">PROPOSTA · CAMADA 1</text>
    <text text-anchor="middle" y="50" font-size="48" font-weight="900" fill="#fff">Tutorial novo do checklist</text>
    <text text-anchor="middle" y="98" font-size="26" font-weight="800" fill="#ff7639">VOCÊ FAZ 2 CHECKLISTS POR DIA</text>
    <text text-anchor="middle" y="135" font-size="18" fill="#b9c2d6">Repetição clara · metáfora sol/lua · contador 1/2 → 2/2</text>
  </g>

  <!-- 4 TELAS-CHAVE DO TUTORIAL — GRID 2×2 -->
  <!-- Phones 220×460, posicionados em x: 200, 660 / y: 320, 850 -->

  <!-- ========== TELA 1: Capa "2 CHECKLISTS POR DIA" ========== -->
  <g transform="translate(200, 320)">
    <rect x="10" y="20" width="220" height="460" rx="32" fill="#000" opacity="0.5" filter="url(#phoneShadow)"/>
    <rect x="0" y="0" width="220" height="460" rx="30" fill="url(#phoneEdge)" stroke="#2a3550" stroke-width="2"/>
    <rect x="6" y="6" width="208" height="448" rx="24" fill="#fff"/>
    <rect x="84" y="6" width="48" height="13" rx="6" fill="#0b0e16"/>

    <!-- Contador 1/2 -->
    <rect x="14" y="32" width="80" height="22" rx="11" fill="#fff5f2" stroke="#ff7639"/>
    <text x="54" y="47" text-anchor="middle" font-size="11" font-weight="800" fill="#ff7639">1 / 2 HOJE</text>

    <!-- Título grande -->
    <text x="110" y="120" text-anchor="middle" font-size="22" font-weight="900" fill="#222">VOCÊ FAZ</text>
    <text x="110" y="148" text-anchor="middle" font-size="32" font-weight="900" fill="#ff7639">2 CHECKLISTS</text>
    <text x="110" y="172" text-anchor="middle" font-size="14" fill="#666">por dia · sempre</text>

    <!-- Sol + Lua lado a lado -->
    <g transform="translate(60, 240)">
      <circle cx="0" cy="0" r="32" fill="url(#solBg)"/>
      <text x="0" y="8" text-anchor="middle" font-size="32">🌅</text>
    </g>
    <text x="60" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#222">CHEGOU</text>
    <text x="60" y="312" text-anchor="middle" font-size="11" fill="#666">de manhã</text>

    <text x="110" y="252" text-anchor="middle" font-size="20" font-weight="900" fill="#999">+</text>

    <g transform="translate(160, 240)">
      <circle cx="0" cy="0" r="32" fill="url(#luaBg)"/>
      <text x="0" y="8" text-anchor="middle" font-size="32">🌙</text>
    </g>
    <text x="160" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#222">VAI EMBORA</text>
    <text x="160" y="312" text-anchor="middle" font-size="11" fill="#666">no final</text>

    <!-- Footer -->
    <rect x="14" y="370" width="192" height="56" rx="8" fill="#fff5f2" stroke="#ff7639"/>
    <text x="110" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="#a3530b">SE FALTAR UM</text>
    <text x="110" y="412" text-anchor="middle" font-size="14" font-weight="900" fill="#c0392b">sua hora NÃO conta</text>

    <text x="110" y="500" text-anchor="middle" font-size="13" font-weight="800" fill="#ff7639" letter-spacing="2">PASSO 1</text>
  </g>

  <!-- ========== TELA 2: 🌅 ABRIR (manhã) ========== -->
  <g transform="translate(660, 320)">
    <rect x="10" y="20" width="220" height="460" rx="32" fill="#000" opacity="0.5" filter="url(#phoneShadow)"/>
    <rect x="0" y="0" width="220" height="460" rx="30" fill="url(#phoneEdge)" stroke="#2a3550" stroke-width="2"/>
    <rect x="6" y="6" width="208" height="448" rx="24" fill="#fff"/>
    <rect x="84" y="6" width="48" height="13" rx="6" fill="#0b0e16"/>

    <!-- Contador -->
    <rect x="14" y="32" width="80" height="22" rx="11" fill="#fff5f2" stroke="#ff7639"/>
    <text x="54" y="47" text-anchor="middle" font-size="11" font-weight="800" fill="#ff7639">1 / 2 HOJE</text>

    <!-- Sol grande -->
    <g transform="translate(110, 110)">
      <circle cx="0" cy="0" r="38" fill="url(#solBg)"/>
      <text x="0" y="11" text-anchor="middle" font-size="40">🌅</text>
    </g>
    <text x="110" y="178" text-anchor="middle" font-size="14" font-weight="800" fill="#666" letter-spacing="2">DE MANHÃ</text>
    <text x="110" y="208" text-anchor="middle" font-size="20" font-weight="900" fill="#222">CHEGOU?</text>
    <text x="110" y="232" text-anchor="middle" font-size="20" font-weight="900" fill="#ff9f0a">ABRA O VEÍCULO</text>

    <!-- Botão ABRIR + dedo -->
    <rect x="20" y="270" width="180" height="52" rx="10" fill="url(#solBg)"/>
    <text x="110" y="295" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">🌅 ABRIR TURNO</text>
    <text x="110" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" opacity="0.9">Toque aqui</text>

    <!-- dedo apontando -->
    <g transform="translate(155, 305) rotate(-15)">
      <path d="M -3 -2 V -16 a 4 4 0 0 1 8 0 V -2 h 1 l 2 -8 a 3.5 3.5 0 0 1 7 1.5 L 13 0 v 8 a 12 12 0 0 1 -12 12 a 12 12 0 0 1 -11 -7 l -5 -10 a 3.5 3.5 0 0 1 5.5 -3.5 L -8 4 z"
            fill="#fff" stroke="#222" stroke-width="1.2"/>
    </g>
    <circle cx="155" cy="308" r="18" fill="none" stroke="#ff7639" stroke-width="3" opacity="0.7"/>
    <circle cx="155" cy="308" r="28" fill="none" stroke="#ff7639" stroke-width="1.5" opacity="0.35"/>

    <!-- Mensagem -->
    <text x="110" y="350" text-anchor="middle" font-size="11" fill="#666">Marca SIM/NÃO</text>
    <text x="110" y="366" text-anchor="middle" font-size="11" fill="#666">tira foto se precisar</text>
    <text x="110" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#22b07d">✅ Turno ABERTO</text>

    <text x="110" y="500" text-anchor="middle" font-size="13" font-weight="800" fill="#ff7639" letter-spacing="2">PASSO 2-5</text>
  </g>

  <!-- ========== TELA 3: 🌙 ENCERRAR (final) ========== -->
  <g transform="translate(200, 850)">
    <rect x="10" y="20" width="220" height="460" rx="32" fill="#000" opacity="0.5" filter="url(#phoneShadow)"/>
    <rect x="0" y="0" width="220" height="460" rx="30" fill="url(#phoneEdge)" stroke="#2a3550" stroke-width="2"/>
    <rect x="6" y="6" width="208" height="448" rx="24" fill="#fff"/>
    <rect x="84" y="6" width="48" height="13" rx="6" fill="#0b0e16"/>

    <!-- Contador 2/2 -->
    <rect x="14" y="32" width="80" height="22" rx="11" fill="#e6f6ec" stroke="#22b07d"/>
    <text x="54" y="47" text-anchor="middle" font-size="11" font-weight="800" fill="#0a7a52">2 / 2 HOJE</text>

    <!-- Lua grande -->
    <g transform="translate(110, 110)">
      <circle cx="0" cy="0" r="38" fill="url(#luaBg)"/>
      <text x="0" y="11" text-anchor="middle" font-size="40">🌙</text>
    </g>
    <text x="110" y="178" text-anchor="middle" font-size="14" font-weight="800" fill="#666" letter-spacing="2">NO FINAL DO DIA</text>
    <text x="110" y="208" text-anchor="middle" font-size="20" font-weight="900" fill="#222">VAI EMBORA?</text>
    <text x="110" y="232" text-anchor="middle" font-size="20" font-weight="900" fill="#2e3a5e">ENCERRE O VEÍCULO</text>

    <!-- Botão ENCERRAR + dedo -->
    <rect x="20" y="270" width="180" height="52" rx="10" fill="url(#luaBg)"/>
    <text x="110" y="295" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">🌙 ENCERRAR TURNO</text>
    <text x="110" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" opacity="0.9">Toque aqui</text>

    <g transform="translate(155, 305) rotate(-15)">
      <path d="M -3 -2 V -16 a 4 4 0 0 1 8 0 V -2 h 1 l 2 -8 a 3.5 3.5 0 0 1 7 1.5 L 13 0 v 8 a 12 12 0 0 1 -12 12 a 12 12 0 0 1 -11 -7 l -5 -10 a 3.5 3.5 0 0 1 5.5 -3.5 L -8 4 z"
            fill="#fff" stroke="#222" stroke-width="1.2"/>
    </g>
    <circle cx="155" cy="308" r="18" fill="none" stroke="#5a6cb2" stroke-width="3" opacity="0.7"/>
    <circle cx="155" cy="308" r="28" fill="none" stroke="#5a6cb2" stroke-width="1.5" opacity="0.35"/>

    <text x="110" y="350" text-anchor="middle" font-size="11" fill="#666">Marca SIM/NÃO de saída</text>
    <text x="110" y="395" text-anchor="middle" font-size="13" font-weight="800" fill="#22b07d">✅ Turno FECHADO</text>

    <text x="110" y="500" text-anchor="middle" font-size="13" font-weight="800" fill="#5a6cb2" letter-spacing="2">PASSO 6-9</text>
  </g>

  <!-- ========== TELA 4: Faltou encerrar = ALERTA ========== -->
  <g transform="translate(660, 850)">
    <rect x="10" y="20" width="220" height="460" rx="32" fill="#000" opacity="0.55" filter="url(#phoneShadow)"/>
    <rect x="0" y="0" width="220" height="460" rx="30" fill="url(#phoneEdge)" stroke="#2a3550" stroke-width="2"/>
    <rect x="6" y="6" width="208" height="448" rx="24" fill="#fff"/>
    <rect x="84" y="6" width="48" height="13" rx="6" fill="#0b0e16"/>

    <!-- Contador "1 / 2 — FALTA 1" -->
    <rect x="14" y="32" width="100" height="22" rx="11" fill="#fdecea" stroke="#e1201d"/>
    <text x="64" y="47" text-anchor="middle" font-size="11" font-weight="800" fill="#a51612">⚠️ FALTA 1!</text>

    <!-- Alerta grande -->
    <g transform="translate(110, 130)">
      <circle cx="0" cy="0" r="42" fill="url(#alertBg)"/>
      <text x="0" y="14" text-anchor="middle" font-size="44" fill="#fff" font-weight="900">!</text>
    </g>
    <text x="110" y="208" text-anchor="middle" font-size="20" font-weight="900" fill="#222">VOCÊ ESQUECEU</text>
    <text x="110" y="232" text-anchor="middle" font-size="20" font-weight="900" fill="#e1201d">DE ENCERRAR</text>

    <text x="110" y="270" text-anchor="middle" font-size="13" fill="#666">Você abriu o AC-001 às 07:14</text>
    <text x="110" y="288" text-anchor="middle" font-size="13" fill="#666">e ainda não fechou.</text>

    <!-- Card consequência -->
    <rect x="14" y="308" width="192" height="62" rx="8" fill="#fdecea" stroke="#e1201d"/>
    <text x="110" y="330" text-anchor="middle" font-size="11" font-weight="800" fill="#a51612">SUA HORA</text>
    <text x="110" y="350" text-anchor="middle" font-size="17" font-weight="900" fill="#a51612">NÃO VAI CONTAR</text>
    <text x="110" y="364" text-anchor="middle" font-size="10" fill="#a51612">até você encerrar</text>

    <!-- Botão de ação -->
    <rect x="20" y="386" width="180" height="40" rx="8" fill="url(#luaBg)"/>
    <text x="110" y="411" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">🌙 ENCERRAR AGORA</text>

    <text x="110" y="500" text-anchor="middle" font-size="13" font-weight="800" fill="#e1201d" letter-spacing="2">PASSO 10 · ALERTA</text>
  </g>

  <!-- ============ RODAPÉ ============ -->
  <g transform="translate(540, 1230)">
    <text text-anchor="middle" font-size="20" font-weight="800" fill="#fff">
      <tspan fill="#ff7639">10</tspan> passos
      &#160;·&#160;
      <tspan fill="#ff7639">~2 min</tspan> de duração
      &#160;·&#160;
      <tspan fill="#ff7639">3×</tspan> repetir "2 por dia"
    </text>
    <text text-anchor="middle" y="40" font-size="14" fill="#b9c2d6">Acessível em sga-engeativos.com.br/tutorial/checklist</text>
  </g>

  <text x="540" y="1320" text-anchor="middle" font-size="11" fill="#7a85a0" letter-spacing="2">
    🏗️  ENGETECNICA  ·  ENGEATIVOS
  </text>
</svg>
